<div class="saneamientos-page">

  <!--  TABLA  -->
  <div class="tabla-wrapper">
    <p-table
      [value]="registros"
      dataKey="id"
      selectionMode="single"
      [(selection)]="registroSeleccionado"
      [scrollable]="true"
      scrollHeight="calc(100vh - 110px)"
      styleClass="tabla-saneamientos">

      <ng-template pTemplate="header">
        <tr>
          <th (click)="seleccionarColumna('fecha')">Fecha</th>
          <th (click)="seleccionarColumna('folio')">Folio</th>
          <th (click)="seleccionarColumna('estacion')">Estacion</th>
          <th (click)="seleccionarColumna('circuito')">Circuito</th>
          <th (click)="seleccionarColumna('receta')">Receta</th>
          <th (click)="seleccionarColumna('usuario')">Usuario</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-registro>
        <tr [pSelectableRow]="registro">
          <td>{{ registro.fecha }}</td>
          <td>{{ registro.folio }}</td>
          <td>{{ registro.estacion }}</td>
          <td>{{ registro.circuito }}</td>
          <td>{{ registro.receta }}</td>
          <td>{{ registro.usuario }}</td>
        </tr>
      </ng-template>

    </p-table>
  </div>

  <!-- FILTROS  -->
  <div class="panel-filtros">

    <div class="campo">
      <label>Fecha Inicio</label>
      <p-calendar [(ngModel)]="fechaInicio" dateFormat="dd/mm/yy" [showIcon]="true"></p-calendar>
    </div>

    <div class="campo">
      <label>Fecha Fin</label>
      <p-calendar [(ngModel)]="fechaFin" dateFormat="dd/mm/yy" [showIcon]="true"></p-calendar>
    </div>

    <div class="campo">
      <label>Estacion</label>
      <p-dropdown [options]="estaciones" [(ngModel)]="estacionSeleccionada"></p-dropdown>
    </div>

    <div class="campo">
      <label>Objeto</label>
      <p-dropdown [options]="objetos" [(ngModel)]="objetoSeleccionado"></p-dropdown>
    </div>

    <div class="campo">
      <label>Receta</label>
      <p-dropdown [options]="recetas" [(ngModel)]="recetaSeleccionada"></p-dropdown>
    </div>

    <button pButton label="Cargar" (click)="cargar()"></button>
    <button pButton label="Generar Reporte" (click)="generarReporte()"></button>
    <button pButton label="Cancelar"></button>

  </div>

</div>

<!-- MODAL -->
<app-sanitation-report-view
  [visible]="mostrarReporte"
  (onClose)="mostrarReporte = false"
  [header]="reporte?.header"
  [steps]="steps"
  [chartTemperatura]="chartTemperatura"
  [chartConcentracion]="chartConcentracion"
  [chartFlujo]="chartFlujo">
</app-sanitation-report-view>
